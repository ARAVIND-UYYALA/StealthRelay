databases:
  - name: stealthrelay-db
    plan: free
    databaseName: secure_db
    user: stealthrelay

services:
  - type: web
    name: stealthrelay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stealthrelay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
