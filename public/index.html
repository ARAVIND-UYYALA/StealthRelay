<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Relay | Secure Communications Node</title>
    <meta name="description" content="End-to-end encrypted secure communications platform with real-time chat, video calls, and file vault.">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#06080f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stealth Relay">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* ================================================
           DESIGN SYSTEM — CSS CUSTOM PROPERTIES
           ================================================ */
        :root {
            --bg-deep: #06080f;
            --bg-base: #0b0f1a;
            --bg-surface: rgba(15, 23, 42, 0.65);
            --bg-surface-solid: #0f172a;
            --bg-elevated: rgba(22, 33, 55, 0.55);
            --bg-input: rgba(8, 12, 24, 0.7);

            --border-subtle: rgba(56, 79, 125, 0.25);
            --border-glow: rgba(99, 130, 255, 0.15);
            --border-active: rgba(99, 130, 255, 0.45);

            --text-primary: #e8ecf4;
            --text-secondary: #8b98b8;
            --text-muted: #5a6580;
            --text-inverse: #06080f;

            --accent-blue: #6382ff;
            --accent-blue-soft: rgba(99, 130, 255, 0.12);
            --accent-cyan: #22d3ee;
            --accent-green: #34d399;
            --accent-green-soft: rgba(52, 211, 153, 0.12);
            --accent-red: #f87171;
            --accent-red-soft: rgba(248, 113, 113, 0.1);
            --accent-purple: #a78bfa;
            --accent-purple-soft: rgba(167, 139, 250, 0.1);
            --accent-amber: #fbbf24;
            --accent-amber-soft: rgba(251, 191, 36, 0.1);

            --gradient-brand: linear-gradient(135deg, #6382ff 0%, #a78bfa 50%, #22d3ee 100%);
            --gradient-card: linear-gradient(145deg, rgba(15, 23, 42, 0.8), rgba(10, 16, 32, 0.6));

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.25);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.35);
            --shadow-glow: 0 0 20px rgba(99, 130, 255, 0.08);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 350ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ================================================
           BASE RESET & GLOBALS
           ================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ================================================
           ANIMATED BACKGROUND
           ================================================ */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 130, 255, 0.06) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: meshFloat1 20s ease-in-out infinite;
        }

        .bg-mesh::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: meshFloat2 25s ease-in-out infinite;
        }

        @keyframes meshFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, 60px) scale(1.1); }
            66% { transform: translate(40px, -40px) scale(0.95); }
        }

        @keyframes meshFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, -60px) scale(1.15); }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(99, 130, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 130, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ================================================
           TOAST NOTIFICATION SYSTEM
           ================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            transform: translateX(120%);
            animation: toastSlideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            max-width: 380px;
        }

        .toast.removing {
            animation: toastSlideOut 0.3s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
        }

        .toast.success { border-left: 3px solid var(--accent-green); }
        .toast.error { border-left: 3px solid var(--accent-red); }
        .toast.info { border-left: 3px solid var(--accent-blue); }
        .toast.warning { border-left: 3px solid var(--accent-amber); }

        .toast-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        @keyframes toastSlideIn {
            to { transform: translateX(0); }
        }
        @keyframes toastSlideOut {
            to { transform: translateX(120%); opacity: 0; }
        }

        /* ================================================
           APP LAYOUT SHELL
           ================================================ */
        .app-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP BAR --- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(8, 12, 24, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--gradient-brand);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 16px rgba(99, 130, 255, 0.25);
        }

        .brand-text {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-indicator.offline {
            background: var(--accent-red-soft);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.15);
        }

        .status-indicator.online {
            background: var(--accent-green-soft);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-indicator.online .status-dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
            50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--gradient-brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
        }

        .btn-logout {
            background: none;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-logout:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: var(--accent-red-soft);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 0;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* ================================================
           AUTH SCREEN
           ================================================ */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 68px);
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 40px 36px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            animation: authCardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes authCardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .auth-logo-icon {
            width: 56px;
            height: 56px;
            background: var(--gradient-brand);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 30px rgba(99, 130, 255, 0.2);
        }

        .auth-logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .auth-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition-base);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-soft), 0 0 16px rgba(99, 130, 255, 0.06);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            outline: none;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--gradient-brand);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 130, 255, 0.25);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(99, 130, 255, 0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(30, 42, 68, 0.6);
            border-color: var(--border-active);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent-purple), #6382ff);
            color: white;
            box-shadow: 0 4px 16px rgba(167, 139, 250, 0.2);
        }

        .btn-accent:hover {
            box-shadow: 0 6px 24px rgba(167, 139, 250, 0.3);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #e05252);
            color: white;
        }

        .btn-danger:hover {
            box-shadow: 0 4px 16px rgba(248, 113, 113, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-green), #22c99e);
            color: var(--text-inverse);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-ghost:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .btn-full { width: 100%; }

        .btn-sm {
            padding: 8px 14px;
            font-size: 0.82rem;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        /* ================================================
           SIDEBAR — LEFT (Online Users)
           ================================================ */
        .sidebar-left {
            background: rgba(8, 12, 24, 0.5);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 68px);
            position: sticky;
            top: 68px;
        }

        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-header h3 {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-green-soft);
            color: var(--accent-green);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            min-width: 22px;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            cursor: default;
            position: relative;
        }

        .user-item:hover {
            background: var(--bg-elevated);
        }

        .user-item-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            position: relative;
        }

        .user-item-avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            border: 2px solid var(--bg-deep);
        }

        .user-item-info {
            flex: 1;
            min-width: 0;
        }

        .user-item-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-item-role {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .user-item-self .user-item-name::after {
            content: ' (You)';
            color: var(--text-muted);
            font-weight: 400;
        }

        .user-item-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: var(--transition-fast);
        }

        .user-item:hover .user-item-actions {
            opacity: 1;
        }

        .user-item-self .user-item-actions {
            display: none;
        }

        .btn-call {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--accent-green-soft);
            color: var(--accent-green);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: var(--transition-fast);
        }

        .btn-call:hover {
            background: var(--accent-green);
            color: var(--text-inverse);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }

        /* ================================================
           CENTRAL PANEL (Chat)
           ================================================ */
        .center-panel {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 68px);
            position: relative;
        }

        .panel-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 12, 24, 0.3);
        }

        .panel-header h2 {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            background: var(--accent-blue-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        /* Chat Messages */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 10px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            animation: msgIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            line-height: 1.5;
            font-size: 0.92rem;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-incoming {
            align-self: flex-start;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(99, 130, 255, 0.2), rgba(167, 139, 250, 0.15));
            border: 1px solid rgba(99, 130, 255, 0.2);
            border-bottom-right-radius: 4px;
        }

        .msg-sender-name {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 2px;
        }

        .msg-outgoing .msg-sender-name {
            color: var(--accent-cyan);
        }

        .msg-text {
            color: var(--text-primary);
            word-break: break-word;
        }

        .msg-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 4px;
        }

        .chat-date-separator {
            text-align: center;
            padding: 12px 0;
        }

        .chat-date-separator span {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: var(--bg-surface-solid);
            padding: 4px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .chat-empty-icon {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .chat-empty p {
            font-size: 0.88rem;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(8, 12, 24, 0.3);
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 4px 4px 4px 16px;
            transition: var(--transition-base);
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-soft);
        }

        .chat-input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            padding: 10px 0;
        }

        .chat-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .chat-send-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--gradient-brand);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .chat-send-btn:hover {
            box-shadow: 0 0 16px rgba(99, 130, 255, 0.3);
            transform: scale(1.05);
        }

        /* ================================================
           SIDEBAR — RIGHT (Video + Vault + Admin)
           ================================================ */
        .sidebar-right {
            background: rgba(8, 12, 24, 0.5);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--border-subtle);
            height: calc(100vh - 68px);
            position: sticky;
            top: 68px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-right::-webkit-scrollbar { width: 4px; }
        .sidebar-right::-webkit-scrollbar-track { background: transparent; }
        .sidebar-right::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 10px;
        }

        .right-panel {
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .right-panel:last-child {
            border-bottom: none;
        }

        .right-panel-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .right-panel-title .icon {
            font-size: 0.9rem;
        }

        /* --- VIDEO CALL --- */
        .video-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
        }

        .video-wrapper video {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .video-wrapper .video-label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="grid-overlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="app-wrapper" id="appWrapper">
        <!-- TOP BAR -->
        <div class="topbar">
            <div class="topbar-brand">
                <div class="brand-icon">🔐</div>
                <div class="brand-text">Stealth Relay</div>
            </div>
            <div class="topbar-status">
                <div class="status-indicator online" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
            </div>
            <div class="topbar-user">
                <div class="user-avatar" id="topbarAvatar">?</div>
                <span id="topbarUsername">User</span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>

        <!-- AUTH SCREEN -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="auth-logo-icon">🔐</div>
                    <h1>Stealth Relay</h1>
                    <p>Secure Global Communication</p>
                </div>
                <div class="auth-divider"></div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="usernameInput" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label class="form-label">Passcode</label>
                    <input type="password" class="form-input" id="passcodeInput" placeholder="Enter passcode">
                </div>
                <button class="btn btn-primary btn-full" id="loginBtn">Connect</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="mainContent" style="display: none;">
            <!-- LEFT SIDEBAR: Online Users -->
            <div class="sidebar-left">
                <div class="sidebar-header">
                    <h3>👥 Online <span class="online-count" id="onlineCount">0</span></h3>
                </div>
                <div class="user-list" id="userList"></div>
            </div>

            <!-- CENTER PANEL: Chat -->
            <div class="center-panel">
                <div class="panel-header">
                    <h2><span class="panel-header-icon">💬</span>Chat</h2>
                </div>
                <div class="chat-area" id="chatArea">
                    <div class="chat-empty">
                        <div class="chat-empty-icon">💭</div>
                        <p>No messages yet. Start a conversation!</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                        <button class="chat-send-btn" id="sendBtn">↗️</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDEBAR: Video + Vault -->
            <div class="sidebar-right">
                <!-- VIDEO SECTION -->
                <div class="right-panel">
                    <div class="right-panel-title"><span class="icon">📹</span>Video</div>
                    <div class="video-container">
                        <div class="video-wrapper">
                            <video id="localVideo" autoplay muted playsinline></video>
                            <div class="video-label">You</div>
                        </div>
                        <div class="video-wrapper">
                            <video id="remoteVideo" autoplay playsinline></video>
                            <div class="video-label">Remote</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // WEBRTC & MEDIA CONFIGURATION
        // ==========================================
        let socket = null;
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let currentUser = null;
        let activeCall = null;

        const ICE_SERVERS = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        const MEDIA_CONSTRAINTS = {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: 'user'
            }
        };

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ==========================================
        // MEDIA STREAM MANAGEMENT
        // ==========================================
        async function startLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia(MEDIA_CONSTRAINTS);
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                console.log('✓ Local stream started successfully');
                showToast('Camera & microphone enabled', 'success');
            } catch (error) {
                console.error('✗ Error accessing media:', error);
                if (error.name === 'NotAllowedError') {
                    showToast('Camera/microphone access denied. Please check browser permissions.', 'error');
                } else if (error.name === 'NotFoundError') {
                    showToast('No camera or microphone found. Please check your devices.', 'error');
                } else {
                    showToast('Error accessing media devices: ' + error.message, 'error');
                }
            }
        }

        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }

        // ==========================================
        // WEBRTC PEER CONNECTION
        // ==========================================
        async function createPeerConnection() {
            try {
                peerConnection = new RTCPeerConnection(ICE_SERVERS);

                // Add local stream tracks
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }

                // Handle remote stream
                peerConnection.ontrack = (event) => {
                    console.log('✓ Remote track received:', event.track.kind);
                    remoteStream = event.streams[0];
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    showToast('Remote stream connected', 'success');
                };

                // Handle ICE candidates
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && activeCall) {
                        socket.emit('ice-candidate', {
                            targetSocketId: activeCall,
                            candidate: event.candidate
                        });
                    }
                };

                // Handle connection state changes
                peerConnection.onconnectionstatechange = () => {
                    console.log('Connection state:', peerConnection.connectionState);
                    if (peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'disconnected') {
                        showToast('Connection lost', 'warning');
                        closePeerConnection();
                    }
                };

                console.log('✓ Peer connection created');
            } catch (error) {
                console.error('Error creating peer connection:', error);
                showToast('Error creating peer connection', 'error');
            }
        }

        function closePeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.srcObject = null;
            activeCall = null;
        }

        async function initiateCall(targetSocketId) {
            try {
                activeCall = targetSocketId;
                await createPeerConnection();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('video-offer', {
                    targetSocketId: targetSocketId,
                    offer: offer
                });
                console.log('✓ Video offer sent');
            } catch (error) {
                console.error('Error initiating call:', error);
                showToast('Error initiating call', 'error');
            }
        }

        // ==========================================
        // SOCKET.IO EVENT HANDLERS
        // ==========================================
        function setupSocketHandlers() {
            // Incoming video offer
            socket.on('video-offer', async (data) => {
                try {
                    console.log('Received video offer from:', data.senderUsername);
                    activeCall = data.senderSocketId;
                    await createPeerConnection();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('video-answer', {
                        targetSocketId: data.senderSocketId,
                        answer: answer
                    });
                    console.log('✓ Video answer sent');
                    showToast('Call from ' + data.senderUsername, 'info');
                } catch (error) {
                    console.error('Error handling video offer:', error);
                }
            });

            // Incoming video answer
            socket.on('video-answer', async (data) => {
                try {
                    console.log('Received video answer');
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    console.log('✓ Remote description set');
                } catch (error) {
                    console.error('Error handling video answer:', error);
                }
            });

            // Incoming ICE candidate
            socket.on('ice-candidate', async (data) => {
                try {
                    if (peerConnection && data.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch (error) {
                    console.error('Error adding ICE candidate:', error);
                }
            });

            // Video call rejected
            socket.on('video-rejected', (data) => {
                showToast(data.senderUsername + ' rejected the call', 'warning');
                closePeerConnection();
            });

            // Video call ended
            socket.on('video-hangup', () => {
                showToast('Call ended', 'info');
                closePeerConnection();
            });

            // Online users list
            socket.on('online-users', (users) => {
                updateUserList(users);
            });

            // Chat message
            socket.on('receive_message', (data) => {
                addMessage(data.sender, data.content, 'incoming');
            });
        }

        // ==========================================
        // AUTH & UI HANDLERS
        // ==========================================
        function updateUserList(users) {
            const userList = document.getElementById('userList');
            const count = document.getElementById('onlineCount');
            userList.innerHTML = '';
            count.textContent = users.length;

            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item' + (user.username === currentUser.username ? ' user-item-self' : '');
                userItem.innerHTML = `
                    <div class="user-item-avatar">${user.username.charAt(0).toUpperCase()}</div>
                    <div class="user-item-info">
                        <div class="user-item-name">${user.username}</div>
                        <div class="user-item-role">${user.role}</div>
                    </div>
                    ${user.username !== currentUser.username ? `
                    <div class="user-item-actions">
                        <button class="btn-call" onclick="initiateCall('${user.socketId}')">📞</button>
                    </div>
                    ` : ''}
                `;
                userList.appendChild(userItem);
            });
        }

        function addMessage(sender, content, type) {
            const chatArea = document.getElementById('chatArea');
            if (chatArea.querySelector('.chat-empty')) {
                chatArea.innerHTML = '';
            }
            const msg = document.createElement('div');
            msg.className = 'msg-bubble msg-' + type;
            msg.innerHTML = `
                <div class="msg-sender-name">${sender}</div>
                <div class="msg-text">${content}</div>
                <div class="msg-time">${new Date().toLocaleTimeString()}</div>
            `;
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('usernameInput').value;
            const passcode = document.getElementById('passcodeInput').value;

            if (!username || !passcode) {
                showToast('Please enter username and passcode', 'warning');
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, passcode })
                });
                const data = await response.json();

                if (!response.ok) {
                    showToast(data.error || 'Login failed', 'error');
                    return;
                }

                currentUser = { username, token: data.token };
                document.getElementById('topbarUsername').textContent = username;
                document.getElementById('topbarAvatar').textContent = username.charAt(0).toUpperCase();
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'grid';

                // Connect socket after successful login
                socket = io({
                    auth: { token: data.token }
                });

                socket.on('connect', () => {
                    console.log('✓ Connected to server');
                    showToast('Connected to Stealth Relay', 'success');
                    startLocalStream();
                });

                socket.on('disconnect', () => {
                    console.log('✗ Disconnected from server');
                    showToast('Disconnected from server', 'warning');
                    stopLocalStream();
                    closePeerConnection();
                });

                setupSocketHandlers();
            } catch (error) {
                console.error('Login error:', error);
                showToast('Network error during login', 'error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (socket) socket.disconnect();
            stopLocalStream();
            closePeerConnection();
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('passcodeInput').value = '';
            currentUser = null;
            showToast('Logged out', 'info');
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message && socket) {
                socket.emit('send_message', { content: message });
                addMessage(currentUser.username, message, 'outgoing');
                input.value = '';
            }
        });

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });
    </script>
</body>
</html>
